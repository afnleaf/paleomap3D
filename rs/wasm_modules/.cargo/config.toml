[build]
jobs = 16

[target.'cfg(not(target_family = "wasm"))']
rustflags = ["--cfg=bevy_dylib"]

[unstable]
mtime-on-use = true
#build-std = []

#[target.wasm32-unknown-unknown]
#rustflags = []

[target.wasm32-unknown-unknown]
rustflags = ["-C", "panic=abort"]

# EmbeddedAssetPlugin embeds one folder; hd6min data is added by the hd6min feature instead
[env]
BEVY_ASSET_PATH = { value = "assets/base", relative = true }
